<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-label="Kiorex Passport architecture" font-family="Jost, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Kiorex Passport architecture</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3730A3"/><stop offset="1" stop-color="#0369A1"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3730A3"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E8735E"/></marker></defs>
<rect width="1100" height="470" rx="18" fill="#F4F6FC"/>
<rect x="0" y="0" width="1100" height="6" rx="3" fill="url(#g)"/><text x="32" y="46" font-size="22" font-weight="600" fill="#1E1B4B">Kiorex Passport: config-as-code + local dev IdP</text><text x="32" y="68" font-size="13" fill="#475569">Production = managed IdP (default Cognito, vendor decision open). Local = oidc-provider on :4400.</text><rect x="40" y="100" width="230" height="60" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
<text x="155" y="127" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Kiorex web / ops / mobile</text><text x="155" y="145" text-anchor="middle" font-size="11" fill="#475569">public clients, PKCE S256</text><rect x="290" y="100" width="230" height="60" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
<text x="405" y="127" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Kiorly Clinic</text><text x="405" y="145" text-anchor="middle" font-size="11" fill="#475569">confidential client</text><rect x="540" y="100" width="230" height="60" rx="10" fill="#EEF2FF" stroke="#3730A3" stroke-width="1.6"/>
<text x="655" y="127" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Passport web UI</text><text x="655" y="145" text-anchor="middle" font-size="11" fill="#475569">/account (React, AR/EN RTL)</text><rect x="790" y="100" width="270" height="60" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
<text x="925" y="127" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Org admins / HR systems</text><text x="925" y="145" text-anchor="middle" font-size="11" fill="#475569">SCIM 2.0 per-org token</text><rect x="40" y="200" width="1020" height="130" rx="14" fill="#fff" stroke="#3730A3" stroke-width="2"/><text x="60" y="225" text-anchor="start" font-size="14" fill="#3730A3" font-weight="600">apps/dev-idp  (local only, refuses NODE_ENV=production)</text><rect x="58" y="245" width="115" height="60" rx="8" fill="#EEF2FF" stroke="#3730A3"/><text x="115.5" y="280" text-anchor="middle" font-size="11" fill="#334155" font-weight="600">OIDC provider</text><rect x="183" y="245" width="115" height="60" rx="8" fill="#EEF2FF" stroke="#3730A3"/><text x="240.5" y="280" text-anchor="middle" font-size="11" fill="#334155" font-weight="600">OTP + rate limits</text><rect x="308" y="245" width="115" height="60" rx="8" fill="#EEF2FF" stroke="#3730A3"/><text x="365.5" y="280" text-anchor="middle" font-size="11" fill="#334155" font-weight="600">Passkeys (WebAuthn)</text><rect x="433" y="245" width="115" height="60" rx="8" fill="#EEF2FF" stroke="#3730A3"/><text x="490.5" y="280" text-anchor="middle" font-size="11" fill="#334155" font-weight="600">TOTP step-up</text><rect x="558" y="245" width="115" height="60" rx="8" fill="#EEF2FF" stroke="#3730A3"/><text x="615.5" y="280" text-anchor="middle" font-size="11" fill="#334155" font-weight="600">Guardian + act-as</text><rect x="683" y="245" width="115" height="60" rx="8" fill="#EEF2FF" stroke="#3730A3"/><text x="740.5" y="280" text-anchor="middle" font-size="11" fill="#334155" font-weight="600">Account linking</text><rect x="808" y="245" width="115" height="60" rx="8" fill="#EEF2FF" stroke="#3730A3"/><text x="865.5" y="280" text-anchor="middle" font-size="11" fill="#334155" font-weight="600">Orgs + SCIM</text><rect x="933" y="245" width="115" height="60" rx="8" fill="#EEF2FF" stroke="#3730A3"/><text x="990.5" y="280" text-anchor="middle" font-size="11" fill="#334155" font-weight="600">Back-channel logout</text><path d="M155 160L155 200" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><path d="M405 160L405 200" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><path d="M655 160L655 200" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><path d="M925 160L925 200" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><rect x="40" y="370" width="300" height="70" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.6"/>
<text x="190" y="402" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">config/idp.json</text><text x="190" y="420" text-anchor="middle" font-size="11" fill="#475569">clients, scopes, claims, lifetimes, OTP + MFA policy</text><rect x="380" y="370" width="300" height="70" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
<text x="530" y="402" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">packages/otp-sender</text><text x="530" y="420" text-anchor="middle" font-size="11" fill="#475569">Cognito custom-auth triggers + channels (mock)</text><rect x="720" y="370" width="340" height="70" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
<text x="890" y="402" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">packages/backchannel</text><text x="890" y="420" text-anchor="middle" font-size="11" fill="#475569">sign / verify / deliver logout tokens</text><path d="M190 330L190 370" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><path d="M530 330L530 370" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><path d="M890 330L890 370" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
