<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-label="Passport sign-in flow" font-family="Jost, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Passport sign-in flow</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3730A3"/><stop offset="1" stop-color="#0369A1"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3730A3"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E8735E"/></marker></defs>
<rect width="1100" height="360" rx="18" fill="#F4F6FC"/>
<rect x="0" y="0" width="1100" height="6" rx="3" fill="url(#g)"/><text x="32" y="46" font-size="22" font-weight="600" fill="#1E1B4B">Phone OTP sign-in (auth code + PKCE)</text><text x="32" y="68" font-size="13" fill="#475569">Access token 15 min, refresh 30 days with rotation and reuse detection. No clinical data in tokens (ADR-013).</text><rect x="40" y="100" width="220" height="52" rx="10" fill="#EEF2FF" stroke="#3730A3" stroke-width="1.6"/>
<text x="150" y="131" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">App (Kiorex web)</text><rect x="300" y="100" width="220" height="52" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.6"/>
<text x="410" y="131" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Passport :4400</text><rect x="560" y="100" width="220" height="52" rx="10" fill="#EEF2FF" stroke="#3730A3" stroke-width="1.6"/>
<text x="670" y="131" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">OTP sender (mock)</text><rect x="820" y="100" width="220" height="52" rx="10" fill="#EEF2FF" stroke="#3730A3" stroke-width="1.6"/>
<text x="930" y="131" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Kiorex API</text><path d="M150 195L410 195" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="280" y="189" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="600">1 /auth?code_challenge (S256)</text><path d="M410 215L670 215" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="540" y="209" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="600">2 send OTP to phone</text><path d="M670 235L410 235" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="540" y="229" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="600">3 code (dev inbox, seed OTP)</text><path d="M410 255L150 255" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="280" y="249" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="600">4 auth code at redirect_uri</text><path d="M150 275L410 275" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="280" y="269" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="600">5 /token + code_verifier</text><path d="M410 295L150 295" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="280" y="289" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="600">6 JWT RS256, aud kiorex-api</text><path d="M150 315L930 315" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="540" y="309" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="600">7 Bearer access token</text><path d="M410 335L930 335" stroke="#E8735E" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#c)"/><text x="670" y="329" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="600">8 back-channel logout (session.revoked)</text><path d="M150 152V347" stroke="#CBD5E1" stroke-dasharray="3 4"/><path d="M410 152V347" stroke="#CBD5E1" stroke-dasharray="3 4"/><path d="M670 152V347" stroke="#CBD5E1" stroke-dasharray="3 4"/><path d="M930 152V347" stroke="#CBD5E1" stroke-dasharray="3 4"/>
</svg>
